{% extends 'base.html' %}
{% block content %}
<style>
    /* Premium Ambient Glow for Coming Soon Card */
    .coming-soon-glow {
        background: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15) 0%, rgba(10, 15, 29, 0.95) 60%, #04060b 100%);
        border: 1px solid rgba(56, 189, 248, 0.25);
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }
    
    /* Elegant Pulsing Rings for the Crown Icon */
    @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 0.2; }
        100% { transform: scale(0.8); opacity: 0.8; }
    }
    .pulse-icon {
        animation: pulse-ring 4s infinite cubic-bezier(0.16, 1, 0.3, 1);
    }
</style>

<div class="max-w-xl mx-auto px-2 sm:px-0 h-[80vh] flex flex-col pb-20">

    <!-- Top Navigation Row -->
    <div class="flex items-center justify-between px-1 shrink-0 pt-2">
        <a href="/app" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] text-slate-200 text-xs font-gotham transition active:scale-95 shadow-sm">
            <i class="fa-solid fa-arrow-left text-[10px] text-blue-500"></i>
            <span>ড্যাশবোর্ড</span>
        </a>

        <div class="flex items-center gap-1.5 bg-white/[0.04] border border-white/10 px-3 py-1.5 rounded-full text-xs font-gotham shadow-sm">
            <span class="text-slate-400 text-[9px] uppercase tracking-wider">Status:</span>
            <span class="font-bold text-sky-400 uppercase text-[9px] tracking-widest flex items-center gap-1">
                <span class="w-1 h-1 rounded-full bg-sky-400 animate-ping"></span> Upgrade
            </span>
        </div>
    </div>

    <!-- ================= 🌟 EXCLUSIVE "COMING SOON" BANNER 🌟 ================= -->
    <div class="flex-1 flex items-center justify-center">
        <div class="coming-soon-glow rounded-[32px] p-8 sm:p-10 w-full max-w-sm text-center space-y-6 relative overflow-hidden select-none">
            
            <!-- Ambient Corner Lights -->
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Floating Crown Icon with Radar Pulse -->
            <div class="relative w-24 h-24 mx-auto flex items-center justify-center">
                <div class="absolute inset-0 rounded-full border border-sky-400/30 pulse-icon"></div>
                <div class="absolute inset-3 rounded-full border border-amber-400/20 pulse-icon" style="animation-delay: 2s;"></div>
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500/10 to-sky-500/10 border border-white/10 flex items-center justify-center text-3xl text-amber-400 shadow-inner backdrop-blur-md z-10">
                    <i class="fa-solid fa-crown drop-shadow-[0_0_15px_rgba(245,158,11,0.5)]"></i>
                </div>
            </div>

            <!-- Typography & Message -->
            <div class="space-y-2 relative z-10">
                <h1 class="font-classic-seasons text-3xl sm:text-4xl font-normal text-white uppercase tracking-widest">
                    Coming <span class="text-slate-400 font-light italic lowercase text-2xl sm:text-3xl">Soon</span>
                </h1>
                <p class="text-[11px] sm:text-xs text-slate-400 font-gotham font-light max-w-xs mx-auto leading-relaxed pt-1">
                    TaskWallet-এর এক্সক্লুসিভ VIP মেম্বারশিপ প্যাকেজ এবং প্রিমিয়াম সুবিধাগুলো খুব শীঘ্রই উন্মুক্ত করা হবে।
                </p>
            </div>

            <!-- Bottom Glowing Tag -->
            <div class="pt-3 relative z-10">
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-blue-600/10 border border-blue-500/20 text-sky-400 font-gotham text-[9px] font-bold uppercase tracking-widest shadow-[0_0_15px_rgba(37,99,235,0.15)]">
                    <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span>
                    Stay Tuned
                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}
