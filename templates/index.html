{% extends 'base.html' %}
{% block content %}
<style>
    /* 30% Structural Glass Inputs */
    .fintech-input-box {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.2s ease-in-out;
    }
    /* 10% Electric Blue Focus Accent */
    .fintech-input-box:focus-within {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
        background: rgba(255, 255, 255, 0.05);
    }
</style>

<div class="max-w-sm mx-auto py-2 space-y-4">

    <!-- 1. Top Action Row (Left: Login Button | Right: Headphone Support) -->
    <div class="flex items-center justify-between px-1">
        <!-- Left Top Login Button -->
        <a href="/login" 
           class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] text-slate-200 text-xs font-gotham transition active:scale-95 shadow-sm">
            <i class="fa-solid fa-arrow-left text-[10px] text-blue-500"></i>
            <span>লগইন</span>
        </a>

        <!-- Right Headphone Support Link -->
        <a href="https://t.me/task_wallet_online" target="_blank" 
           class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.08] text-slate-400 hover:text-slate-200 text-xs font-gotham transition active:scale-95" 
           title="সাপোর্ট">
            <i class="fa-solid fa-headset text-blue-400 text-xs"></i>
            <span>সাপোর্ট</span>
        </a>
    </div>

    <!-- 2. Minimal Video Tutorial CTA (10% Blue Accent) -->
    <a href="/tutorial" 
       class="group relative overflow-hidden flex items-center justify-between p-3 rounded-2xl bg-white/[0.03] hover:bg-white/[0.06] border border-white/[0.08] transition active:scale-[0.99]">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-blue-600/20 border border-blue-500/30 text-blue-400 flex items-center justify-center text-xs group-hover:scale-105 transition">
                <i class="fa-solid fa-play text-[10px]"></i>
            </div>
            <div class="leading-tight">
                <span class="text-xs font-semibold text-slate-200 block">কাজের ভিডিও টিউটোরিয়াল</span>
                <span class="text-[10px] text-slate-500 font-gotham">১ মিনিটে নিয়ম দেখে নিন</span>
            </div>
        </div>
        <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:text-blue-400 group-hover:translate-x-0.5 transition"></i>
    </a>

    <!-- 3. Headline -->
    <div class="space-y-0.5 text-left px-1 select-none">
        <h1 class="font-classic-seasons text-2xl font-normal text-white uppercase tracking-wide">
            নতুন অ্যাকাউন্ট তৈরি
        </h1>
        <p class="text-xs text-slate-400 font-gotham font-light">সঠিক ইমেইল ও পাসওয়ার্ড দিয়ে জয়েন করুন</p>
    </div>

    <!-- 4. Clean Signup Form (No Name Input - Auto from Email) -->
    <form action="/register" method="POST" onsubmit="return validateEmail('regEmail')" class="space-y-3 pt-1">
        <input type="hidden" name="device_id">

        <!-- Email Field -->
        <div class="space-y-1">
            <label class="block text-[10px] font-gotham uppercase tracking-wider text-slate-400 ml-1">ইমেইল অ্যাড্রেস</label>
            <div class="fintech-input-box rounded-2xl px-3.5 py-2.5 flex items-center gap-2.5">
                <i class="fa-solid fa-envelope text-slate-500 text-xs w-4 text-center"></i>
                <input type="email" id="regEmail" name="email" required placeholder="user@gmail.com" 
                       class="w-full bg-transparent text-xs font-gotham text-slate-100 focus:outline-none placeholder-slate-600">
            </div>
            <p class="text-[9px] text-slate-500 ml-1">ইমেইল থেকেই স্বয়ংক্রিয়ভাবে আপনার প্রোফাইল নাম তৈরি হবে</p>
        </div>

        <!-- Password Field -->
        <div class="space-y-1">
            <label class="block text-[10px] font-gotham uppercase tracking-wider text-slate-400 ml-1">পাসওয়ার্ড দিন</label>
            <div class="fintech-input-box rounded-2xl px-3.5 py-2.5 flex items-center gap-2.5 relative">
                <i class="fa-solid fa-lock text-slate-500 text-xs w-4 text-center"></i>
                <input type="password" id="regPassInput" name="password" required placeholder="••••••••" 
                       class="w-full bg-transparent text-xs font-gotham text-slate-100 focus:outline-none placeholder-slate-600 pr-8">
                <button type="button" onclick="togglePass('regPassInput', 'regEyeIcon')" class="absolute right-3.5 text-slate-500 hover:text-slate-300 p-1">
                    <i id="regEyeIcon" class="fa-solid fa-eye-slash text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Referral Field (Optional) -->
        <div class="space-y-1">
            <label class="block text-[10px] font-gotham uppercase tracking-wider text-slate-400 ml-1 flex items-center justify-between">
                <span>রেফারেল কোড</span>
                <span class="text-[9px] text-blue-400 font-gotham">ঐচ্ছিক (৳১০০ বোনাস)</span>
            </label>
            <div class="fintech-input-box rounded-2xl px-3.5 py-2.5 flex items-center gap-2.5">
                <i class="fa-solid fa-gift text-slate-500 text-xs w-4 text-center"></i>
                <input type="text" name="ref_by" id="refField" placeholder="রেফার কোড থাকলে দিন..." 
                       class="w-full bg-transparent text-xs font-gotham text-slate-100 focus:outline-none placeholder-slate-600 uppercase">
            </div>
        </div>

        <!-- 10% Blue Accent Signup CTA Button -->
        <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-gotham font-semibold text-xs py-3.5 px-4 rounded-2xl shadow-lg shadow-blue-600/25 transition mt-2 flex items-center justify-center gap-2">
            <span>অ্যাকাউন্ট তৈরি করুন</span>
            <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </button>
    </form>

    <!-- 5. Already Have an Account Link -->
    <div class="text-center pt-2">
        <p class="text-xs text-slate-400 font-gotham">
            ইতিমধ্যে অ্যাকাউন্ট আছে? 
            <a href="/login" class="text-blue-400 hover:text-blue-300 font-medium ml-1">লগইন করুন &raquo;</a>
        </p>
    </div>

</div>

<!-- Scripts for Password View & Validation -->
<script>
function togglePass(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === "password") {
        input.type = "text";
        icon.className = "fa-solid fa-eye text-xs text-blue-400";
    } else {
        input.type = "password";
        icon.className = "fa-solid fa-eye-slash text-xs text-slate-500";
    }
}

function validateEmail(id) {
    const email = document.getElementById(id).value.trim().toLowerCase();
    if (!email.endsWith('@gmail.com')) {
        alert("অনুগ্রহ করে একটি সঠিক @gmail.com ইমেইল প্রদান করুন!");
        return false;
    }
    return true;
}
</script>
{% endblock %}
