{% extends 'base.html' %}
{% block content %}
<style>
    /* 30% Structural Frosted Glass Inputs */
    .fintech-input-box {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.2s ease-in-out;
    }
    /* 10% Electric Blue Focus Accent */
    .fintech-input-box:focus-within {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
        background: rgba(255, 255, 255, 0.05);
    }

    /* Classic Font Gradient & Shimmer Keyframes */
    @keyframes luxury-shimmer {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .classic-gradient-text {
        background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 35%, #38bdf8 65%, #ffffff 100%);
        background-size: 250% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: luxury-shimmer 7s ease-in-out infinite;
    }

    /* Ambient Glow Behind Title */
    @keyframes subtle-breath {
        0%, 100% { opacity: 0.2; transform: scale(0.96); }
        50% { opacity: 0.45; transform: scale(1.05); }
    }
    .ambient-title-glow {
        animation: subtle-breath 5s infinite ease-in-out;
    }
</style>

<div class="max-w-sm mx-auto py-2 space-y-4">

    <!-- 1. Top Action Row (Left: Register Link | Right: Headphone Support) -->
    <div class="flex items-center justify-between px-1">
        <!-- Left Top Link to Signup -->
        <a href="/" 
           class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] text-slate-200 text-xs font-gotham transition active:scale-95 shadow-sm">
            <i class="fa-solid fa-user-plus text-[10px] text-blue-500"></i>
            <span>সাইন-আপ</span>
        </a>

        <!-- Right Headphone Support Link -->
        <a href="https://t.me/task_wallet_online" target="_blank" 
           class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.08] text-slate-400 hover:text-slate-200 text-xs font-gotham transition active:scale-95" 
           title="২৪/৭ কাস্টমার সাপোর্ট">
            <i class="fa-solid fa-headset text-blue-400 text-xs"></i>
            <span>সাপোর্ট</span>
        </a>
    </div>

    <!-- 2. Headline: Welcome Back to <Special Font>TaskWallet</Special Font> -->
    <div class="relative text-center py-2 select-none">
        <!-- Ambient Radial Glow Circle -->
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-20 bg-blue-600/15 rounded-full blur-2xl pointer-events-none ambient-title-glow"></div>

        <div class="relative space-y-0.5">
            <span class="font-gotham text-xs font-medium tracking-[0.2em] uppercase text-slate-400 block">
                Welcome Back to
            </span>
            <!-- 🌟 TaskWallet in Special "The Seasons" Font with Gradient 🌟 -->
            <h1 class="font-classic-seasons text-3xl sm:text-4xl font-normal tracking-[0.04em] classic-gradient-text uppercase">
                TaskWallet
            </h1>
        </div>

        <p class="relative text-xs text-slate-400 font-gotham font-light tracking-wide mt-1 opacity-90">
            লগইন করে আপনার অ্যাকাউন্টে প্রবেশ করুন
        </p>
    </div>

    <!-- 3. Continue With Google Button -->
    <a href="/auth/google" 
       class="w-full bg-white/[0.04] hover:bg-white/[0.07] border border-white/10 active:scale-95 text-slate-200 font-gotham font-semibold text-xs py-3.5 px-4 rounded-2xl flex items-center justify-center gap-2.5 transition shadow-sm">
        <svg class="w-4 h-4" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
        </svg>
        <span>Continue with Google</span>
    </a>

    <!-- Minimal Divider (Or) -->
    <div class="flex items-center gap-3 my-1">
        <div class="h-px bg-white/[0.06] flex-1"></div>
        <span class="text-[10px] text-slate-500 font-gotham uppercase tracking-widest">or</span>
        <div class="h-px bg-white/[0.06] flex-1"></div>
    </div>

    <!-- 4. Clean Login Form -->
    <form action="/login" method="POST" onsubmit="return validateEmail('loginEmail')" class="space-y-3">
        
        <!-- Email Field -->
        <div class="space-y-1">
            <label class="block text-[10px] font-gotham uppercase tracking-wider text-slate-400 ml-1">ইমেইল</label>
            <div class="fintech-input-box rounded-2xl px-3.5 py-2.5 flex items-center gap-2.5">
                <i class="fa-solid fa-envelope text-slate-500 text-xs w-4 text-center"></i>
                <input type="email" id="loginEmail" name="email" required placeholder="user@gmail.com" 
                       class="w-full bg-transparent text-xs font-gotham text-slate-100 focus:outline-none placeholder-slate-600">
            </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-1">
            <label class="block text-[10px] font-gotham uppercase tracking-wider text-slate-400 ml-1">পাসওয়ার্ড</label>
            <div class="fintech-input-box rounded-2xl px-3.5 py-2.5 flex items-center gap-2.5 relative">
                <i class="fa-solid fa-lock text-slate-500 text-xs w-4 text-center"></i>
                <input type="password" id="loginPassInput" name="password" required placeholder="••••••••" 
                       class="w-full bg-transparent text-xs font-gotham text-slate-100 focus:outline-none placeholder-slate-600 pr-8">
                <button type="button" onclick="togglePass('loginPassInput', 'loginEyeIcon')" class="absolute right-3.5 text-slate-500 hover:text-slate-300 p-1">
                    <i id="loginEyeIcon" class="fa-solid fa-eye-slash text-xs"></i>
                </button>
            </div>
        </div>

        <!-- 🌟 👉 5. FORGOT PASSWORD OPTION 👈 🌟 -->
        <div class="flex items-center justify-end px-1 pt-0.5">
            <a href="/reset" class="text-[11px] font-gotham text-slate-400 hover:text-sky-400 transition hover:underline flex items-center gap-1">
                <i class="fa-solid fa-key text-[10px] text-sky-400/80"></i>
                <span>পাসওয়ার্ড ভুলে গেছেন? (Forgot Password)</span>
            </a>
        </div>

        <!-- 10% Blue Accent Login CTA Button -->
        <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-gotham font-semibold text-xs py-3.5 px-4 rounded-2xl shadow-lg shadow-blue-600/30 transition mt-2 flex items-center justify-center gap-2">
            <span>লগইন করুন</span>
            <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </button>
    </form>

    <!-- 6. Switch to Registration Link -->
    <div class="text-center pt-1">
        <p class="text-xs text-slate-400 font-gotham">
            অ্যাকাউন্ট নেই? 
            <a href="/" class="text-blue-400 hover:text-blue-300 font-medium ml-1">নতুন অ্যাকাউন্ট তৈরি করুন &raquo;</a>
        </p>
    </div>

</div>

<!-- Scripts for Password View & Validation -->
<script>
function togglePass(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === "password") {
        input.type = "text";
        icon.className = "fa-solid fa-eye text-xs text-blue-400";
    } else {
        input.type = "password";
        icon.className = "fa-solid fa-eye-slash text-xs text-slate-500";
    }
}

function validateEmail(id) {
    const email = document.getElementById(id).value.trim().toLowerCase();
    if (!email.endsWith('@gmail.com')) {
        alert("শুধুমাত্র সঠিক @gmail.com ইমেইল প্রদান করুন!");
        return false;
    }
    return true;
}
</script>
{% endblock %}
